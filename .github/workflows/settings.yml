name: Settings contract
on: [push, pull_request]
permissions:
  contents: read
jobs:
  settings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet run --project tests/Settings/Settings.csproj
      - run: dotnet run --project tests/SettingsJson/SettingsJson.csproj
