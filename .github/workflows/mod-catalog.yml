name: Mod catalog
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published stable release tag'
        type: string
        required: true
      content_ref:
        description: 'Content ref (blank uses release tag)'
        type: string
        default: ''
permissions:
  contents: write
jobs:
  catalog:
    uses: joshua-small/qsys-mod-manager/.github/workflows/publish-mod-catalog.yml@23d5bf4ee17bfc6bf467a97156846cd48de6b450
    with:
      tool_revision: 23d5bf4ee17bfc6bf467a97156846cd48de6b450
      tag: ${{ github.event.release.tag_name || inputs.tag || '' }}
      content_ref: ${{ inputs.content_ref || '' }}
      publish: true
